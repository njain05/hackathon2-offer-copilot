<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offer Copilot · Dashboard</title>
<meta name="description" content="Offer Copilot: customer analytics and offer decisions for Nishtha's Pantry.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #F1F4F1; --card: #FFFFFF; --ink: #14201C; --muted: #58685F; --hair: #DFE6E1; --band: rgba(20, 32, 28, .06);
    --side: #12302A; --side-ink: #D7E9E0; --side-muted: #8FB3A4; --accent: #E39B12;
    --series: #0A8A6F;
    --live: #1B6E3A; --pending: #9A5800; --blocked: #B42318;
    --head: "Bricolage Grotesque", system-ui, sans-serif; --body: "Hind", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #0F1513; --card: #18211E; --ink: #E4EDE8; --muted: #9AACA3; --hair: #27332F; --band: rgba(228, 237, 232, .06);
      --side: #0A0F0D; --side-ink: #D7E9E0; --side-muted: #7E9C90; --series: #2E9E83;
      --live: #6CC08A; --pending: #E9B04F; --blocked: #F2877D;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #0F1513; --card: #18211E; --ink: #E4EDE8; --muted: #9AACA3; --hair: #27332F; --band: rgba(228, 237, 232, .06);
    --side: #0A0F0D; --side-ink: #D7E9E0; --side-muted: #7E9C90; --series: #2E9E83;
    --live: #6CC08A; --pending: #E9B04F; --blocked: #F2877D;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 16px/1.5 var(--body); }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  aside { background: var(--side); color: var(--side-ink); padding: 26px 18px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; }
  .brand { font: 700 23px/1.05 var(--head); margin: 0; letter-spacing: -.01em; }
  .client { margin: 4px 0 0; color: var(--side-muted); font-size: 14.5px; }
  aside nav { display: flex; flex-direction: column; gap: 2px; }
  aside nav a { text-decoration: none; padding: 7px 10px; border-radius: 8px; font-weight: 500; color: var(--side-ink); border-left: 3px solid transparent; }
  aside nav a:hover { background: rgba(255,255,255,.06); }
  aside nav a.on { border-left-color: var(--accent); background: rgba(255,255,255,.08); }
  .side-foot { margin-top: auto; font-size: 13.5px; color: var(--side-muted); }
  .side-foot a { color: var(--side-ink); }

  main { padding: 30px 32px 60px; max-width: 1200px; width: 100%; }
  .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 20px; margin-bottom: 18px; }
  h1 { font: 700 clamp(28px, 4vw, 38px)/1.05 var(--head); margin: 0; letter-spacing: -.015em; }
  .asof { margin: 0; color: var(--muted); font-size: 14px; }

  /* today's brief: the one loud thing */
  .brief { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 18px; }
  .brief-title { margin: 0; padding: 14px 22px; font: 700 15px/1 var(--head); color: var(--muted); border-bottom: 1px solid var(--hair); }
  .insight { display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); gap: 4px 22px; padding: 18px 22px; border-bottom: 1px solid var(--hair); }
  .insight:last-child { border-bottom: 0; }
  .insight .fig { font: 700 clamp(30px, 4vw, 40px)/1 var(--head); letter-spacing: -.02em; }
  .insight:first-of-type .fig { font-size: clamp(44px, 6vw, 58px); color: var(--accent); }
  .insight p { margin: 0; }
  .insight .act { margin-top: 6px; color: var(--muted); font-size: 14.5px; }
  .insight .act q { color: var(--ink); font-weight: 600; quotes: "“" "”"; }

  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--card); border-radius: 16px; margin-bottom: 30px; }
  .strip div { padding: 14px 18px; border-right: 1px solid var(--hair); }
  .strip div:last-child { border-right: 0; }
  .strip .l { margin: 0; font-size: 13.5px; color: var(--muted); }
  .strip .v { margin: 2px 0 0; font: 700 24px/1.15 var(--head); }
  .strip .n { margin: 0; font-size: 13px; color: var(--muted); }
  .strip .down { color: var(--blocked); } .strip .up { color: var(--live); }

  section.block { margin-bottom: 34px; }
  .block > h2 { font: 700 22px/1.1 var(--head); margin: 0 0 4px; letter-spacing: -.01em; }
  .block > .sub { margin: 0 0 14px; color: var(--muted); font-size: 14.5px; max-width: 70ch; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
  .panel { background: var(--card); border-radius: 16px; padding: 18px 18px 12px; min-width: 0; }
  .panel h3 { margin: 0 0 2px; font: 700 16px/1.2 var(--head); }
  .panel .sub { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  details.table-view { margin-top: 6px; font-size: 14px; color: var(--muted); }
  details.table-view summary { cursor: pointer; }

  svg text { font: 12px var(--body); fill: var(--muted); }
  svg .band { fill: var(--band); } svg .gridline { stroke: var(--hair); stroke-width: 1; }
  svg .area { fill: var(--series); opacity: .1; } svg .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg .dot { fill: var(--series); stroke: var(--card); stroke-width: 2; } svg .cross { stroke: var(--muted); stroke-width: 1; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--card); border-radius: 8px; padding: 7px 10px;
         font-size: 13px; line-height: 1.35; z-index: 10; opacity: 0; transition: opacity .1s; max-width: 260px; }
  .tip strong { font-size: 15px; }

  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(120px, 210px) 1fr; gap: 12px; align-items: center; border-radius: 8px; }
  .bar-name { font-size: 15px; line-height: 1.2; font-weight: 500; }
  .bar-name small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  .bar-track { display: flex; align-items: center; gap: 8px; }
  .bar { height: 14px; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-row:hover .bar, .bar-row:focus .bar { filter: brightness(1.15); }
  .bar-val { font-size: 14px; font-weight: 600; white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 8px; border-bottom: 1px solid var(--hair); }
  td { padding: 9px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .note { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chip { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip.live { color: var(--live); } .chip.pending { color: var(--pending); } .chip.blocked { color: var(--blocked); }
  .chip.rejected, .chip.ended, .chip.expired { color: var(--muted); }
  .flag { font-size: 13px; font-weight: 600; white-space: nowrap; } .flag.low { color: var(--blocked); } .flag.slow { color: var(--pending); }

  .timeline { list-style: none; margin: 0; padding: 0 0 0 4px; }
  .timeline li { position: relative; padding: 0 0 14px 20px; font-size: 14.5px; }
  .timeline li::before { content: ""; position: absolute; left: 0; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .timeline li::after { content: ""; position: absolute; left: 4px; top: 18px; bottom: 0; width: 1px; background: var(--hair); }
  .timeline li:last-child::after { display: none; }
  .timeline li.blocked::before { background: var(--blocked); } .timeline li.adjusted::before { background: var(--pending); }
  .timeline .meta { color: var(--muted); font-size: 13px; }

  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 22px; background: var(--card); border-radius: 16px; padding: 8px 18px; }
  .rules div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 14.5px; }
  .rules b { font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 14.5px; margin: 4px 0 10px; }
  .state { background: var(--card); border-radius: 16px; padding: 28px; }

  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: sticky; height: auto; padding: 12px 16px; gap: 8px; z-index: 5; flex-direction: column; }
    aside .side-foot, aside .client { display: none; }
    aside nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
    aside nav a { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; padding: 6px 10px; }
    aside nav a.on { border-bottom-color: var(--accent); }
    main { padding: 20px 16px 48px; }
    .cols { grid-template-columns: 1fr; }
    .insight { grid-template-columns: 1fr; }
    .strip div { border-right: 0; border-bottom: 1px solid var(--hair); }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .tip { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div><p class="brand">Offer Copilot</p><p class="client">for Nishtha's Pantry</p></div>
    <nav aria-label="Sections">
      <a href="#overview" class="on">Overview</a><a href="#sales">Sales</a><a href="#customers">Customers</a>
      <a href="#products">Products</a><a href="#offers">Offers</a><a href="#guardrails">Guardrails</a><a href="#rules">Rules</a>
    </nav>
    <div class="side-foot"><p>Store data: synthetic export.</p><p><a href="offers.html">Open the store's offers page</a></p></div>
  </aside>
  <main id="app" aria-live="polite"></main>
</div>
<div class="tip" id="tip" role="status"></div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const compactInr = n => n >= 1e5 ? "₹" + (n / 1e5).toFixed(1).replace(/\.0$/, "") + "L" : n >= 1e3 ? "₹" + Math.round(n / 1e3) + "K" : inr(n);
const fmtDate = s => new Date(s + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (e.className = v) : e.setAttribute(k, v);
  for (const k of kids) if (k !== "" && k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; }

const tip = $("#tip");
function showTip(x, y, value, label) {
  tip.replaceChildren(el("strong", {}, value), el("br"), el("span", {}, label));
  const w = tip.offsetWidth || 180;
  tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
  tip.style.top = (y + 14) + "px";
  tip.style.opacity = 1;
}
const hideTip = () => (tip.style.opacity = 0);
function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw || 1)); return [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= raw); }

// one series, festival bands as annotation, crosshair + keyboard readout
function lineChart(host, points, { festivals = [], fmt = inr, tick = compactInr, label = "", height = 220 }) {
  const W = 720, H = height, m = { l: 50, r: 14, t: 16, b: 26 };
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": label });
  const xs = i => m.l + (i / (points.length - 1)) * (W - m.l - m.r);
  const step = niceStep((Math.max(...points.map(p => p.y)) * 1.1 || 1) / 4);
  const top = Math.ceil((Math.max(...points.map(p => p.y)) * 1.1) / step) * step || step;
  const ys = v => H - m.b - (v / top) * (H - m.t - m.b);
  for (const f of festivals) {
    const idx = points.map((p, i) => [p, i]).filter(([p]) => p.end >= f.start && p.start <= f.end).map(([, i]) => i);
    if (!idx.length) continue;
    const x0 = xs(idx[0]) - 7, x1 = Math.min(xs(idx[idx.length - 1]) + 7, W - m.r);
    svg.append(svgEl("rect", { class: "band", x: x0, y: m.t, width: x1 - x0, height: H - m.t - m.b, rx: 4 }));
    const nearEnd = x1 > W - m.r - 34;
    const t = svgEl("text", { x: nearEnd ? x1 - 2 : (x0 + x1) / 2, y: m.t + 12, "text-anchor": nearEnd ? "end" : "middle" }); t.textContent = f.name; svg.append(t);
  }
  for (let v = 0; v <= top; v += step) {
    svg.append(svgEl("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: ys(v), y2: ys(v) }));
    const t = svgEl("text", { x: m.l - 8, y: ys(v) + 4, "text-anchor": "end" }); t.textContent = tick(v); svg.append(t);
  }
  let lastMonth = "", lastX = -1e9;
  points.forEach((p, i) => {
    const mo = new Date(p.start + "T00:00:00").toLocaleDateString("en-IN", { month: "short" });
    if (mo !== lastMonth && xs(i) - lastX >= 44) { const t = svgEl("text", { x: xs(i), y: H - 6, "text-anchor": "middle" }); t.textContent = mo; svg.append(t); lastX = xs(i); }
    lastMonth = mo;
  });
  const d = points.map((p, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(p.y).toFixed(1)}`).join("");
  svg.append(svgEl("path", { class: "area", d: `${d}L${xs(points.length - 1)},${ys(0)}L${xs(0)},${ys(0)}Z` }));
  svg.append(svgEl("path", { class: "line", d }));
  const li = points.length - 1;
  svg.append(svgEl("circle", { class: "dot", cx: xs(li), cy: ys(points[li].y), r: 4.5 }));
  const cross = svgEl("line", { class: "cross", y1: m.t, y2: H - m.b, opacity: 0 });
  const dot = svgEl("circle", { class: "dot", r: 4.5, opacity: 0 });
  svg.append(cross, dot);
  const hit = svgEl("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent", tabindex: 0, "aria-label": `${label}: use left and right arrows` });
  const pick = i => {
    i = Math.max(0, Math.min(li, i));
    for (const [a, b] of [["x1", "x2"]]) { cross.setAttribute(a, xs(i)); cross.setAttribute(b, xs(i)); }
    cross.setAttribute("opacity", 1); dot.setAttribute("cx", xs(i)); dot.setAttribute("cy", ys(points[i].y)); dot.setAttribute("opacity", 1);
    return i;
  };
  let cur = li;
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    cur = pick(Math.round((((e.clientX - r.left) * (W / r.width)) - m.l) / (W - m.l - m.r) * li));
    showTip(e.clientX, e.clientY, fmt(points[cur].y), points[cur].label);
  });
  hit.addEventListener("pointerleave", () => { hideTip(); cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); });
  hit.addEventListener("keydown", e => {
    if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
    e.preventDefault();
    cur = pick(cur + (e.key === "ArrowRight" ? 1 : -1));
    const r = svg.getBoundingClientRect();
    showTip(r.left + xs(cur) * r.width / W, r.top + 8, fmt(points[cur].y), points[cur].label);
  });
  hit.addEventListener("blur", () => { hideTip(); cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); });
  svg.append(hit);
  host.append(svg);
}

function tableView(headers, rows) {
  const t = el("table");
  t.append(el("thead", {}, el("tr", {}, ...headers.map((h, i) => el("th", i ? { class: "num" } : {}, h)))));
  t.append(el("tbody", {}, ...rows.map(r => el("tr", {}, ...r.map((c, i) => el("td", i ? { class: "num" } : {}, c))))));
  return el("details", { class: "table-view" }, el("summary", {}, "Show as table"), el("div", { class: "scroll" }, t));
}
function block(id, title, sub, ...kids) { return el("section", { class: "block", id }, el("h2", {}, title), sub ? el("p", { class: "sub" }, sub) : "", ...kids); }
function panel(title, sub, ...kids) { return el("div", { class: "panel" }, title ? el("h3", {}, title) : "", sub ? el("p", { class: "sub" }, sub) : "", ...kids); }
const ask = text => el("q", {}, text);

function render(d) {
  const k = d.kpis;
  const gift = d.categories.find(c => c.category === "Gift Box");
  const slow = d.categories.filter(c => c.weeks_of_stock > 12).map(c => c.category);
  const updated = new Date(d.generated_at).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });

  const head = el("div", { class: "page-head", id: "overview" },
    el("h1", {}, "Overview"), el("p", { class: "asof" }, `Store data as of ${fmtDate(d.today)} 2026 · updated ${updated}`));

  const brief = el("div", { class: "brief" }, el("p", { class: "brief-title" }, "Today's brief"),
    el("div", { class: "insight" }, el("div", { class: "fig" }, inr(k.quiet_monthly_spend)),
      el("div", {}, el("p", {}, `a month in spend from ${k.quiet_customers} customers who have gone quiet for 30+ days.`),
        el("p", { class: "act" }, "Ask the seller bot: ", ask("win back customers going quiet")))),
    el("div", { class: "insight" }, el("div", { class: "fig" }, `${d.days_to_diwali} days`),
      el("div", {}, el("p", {}, `to Diwali. ${gift ? `Gift boxes have ${gift.stock} in stock, about ${gift.weeks_of_stock} weeks at today's pace, so promote them with care.` : ""}`),
        el("p", { class: "act" }, "Ask the seller bot: ", ask("make a Diwali gifting offer on nuts and dried fruit")))),
    el("div", { class: "insight" }, el("div", { class: "fig" }, inr(k.cart_value)),
      el("div", {}, el("p", {}, `sitting in ${k.carts_open} open carts.${slow.length ? ` Slow-moving stock: ${slow.join(", ")}.` : ""}`),
        el("p", { class: "act" }, "Customers with a cart get a small nudge when they tap ", el("b", {}, "My offer"), " in the customer bot."))));

  const delta = k.revenue_delta_pct;
  const strip = el("div", { class: "strip" }, ...[
    ["Revenue, 30 days", compactInr(k.revenue_30), delta == null ? "" : `${delta > 0 ? "▲ +" : "▼ "}${delta}% vs previous 30`, delta < 0 ? "down" : "up"],
    ["Orders, 30 days", k.orders_30, `avg basket ${inr(k.aov_30)}`],
    ["Active customers", `${k.active_30}/${k.customers}`, "ordered in 30 days"],
    ["First-time customers", k.first_time_customers, "signed up, no order yet"],
    ["Offers live", k.offers_live, `${k.offers_pending} waiting for approval`],
    ["Guardrail saves", k.guardrail_saves, "lowered or blocked by rules"],
  ].map(([l, v, n, cls]) => el("div", {}, el("p", { class: "l" }, l), el("p", { class: "v" }, v), el("p", { class: `n ${cls || ""}` }, n))));

  // sales
  const weekly = d.weekly.map(w => ({ y: w.revenue, start: w.week,
    end: new Date(new Date(w.week + "T00:00:00").getTime() + 6 * 864e5).toISOString().slice(0, 10),
    label: `Week of ${fmtDate(w.week)} · ${w.orders} orders` }));
  const revHost = el("div");
  lineChart(revHost, weekly, { festivals: d.festivals, label: "Revenue per week" });
  const festPanel = panel("Festival effect", "Units sold per week");
  for (const [key, name] of [["navratri", "Fasting & Navratri items"], ["gifting", "Gifting items"]]) {
    const pts = d.festival_units[key].map((y, i) => ({ ...weekly[i], y, label: `${weekly[i].label.split(" · ")[0]} · ${name}` }));
    const peak = pts.reduce((a, b) => (b.y > a.y ? b : a));
    festPanel.append(el("p", { class: "sub", style: "margin:8px 0 0" }, `${name}: peak ${peak.y}, week of ${fmtDate(peak.start)}`));
    const h = el("div"); festPanel.append(h);
    lineChart(h, pts, { festivals: d.festivals, fmt: v => `${v} units`, tick: v => v, label: `${name} per week`, height: 140 });
  }
  const sales = block("sales", "Sales", "Complete weeks since the data starts on 25 Apr. Shaded: festival weeks.",
    el("div", { class: "cols" },
      panel("Revenue per week", "", revHost, tableView(["Week", "Revenue", "Orders"], d.weekly.map(w => [fmtDate(w.week), inr(w.revenue), w.orders]))),
      festPanel));

  // customers
  const maxC = Math.max(...d.segments.map(s => s.customers));
  const bars = el("div", { class: "bars" }, ...d.segments.map(s => {
    const info = `${s.name} · avg spend ${inr(s.avg_spend)}` + (s.avg_days_since_order != null ? ` · last order ~${s.avg_days_since_order} days ago` : "");
    const row = el("div", { class: "bar-row", tabindex: 0, "aria-label": `${s.name}: ${s.customers} customers. ${s.action}` },
      el("div", { class: "bar-name" }, s.name, el("small", {}, s.action)),
      el("div", { class: "bar-track" }, el("div", { class: "bar", style: `width:${(s.customers / maxC) * 72}%` }), el("span", { class: "bar-val" }, `${s.customers} · ${s.share_pct}%`)));
    row.addEventListener("pointermove", e => showTip(e.clientX, e.clientY, `${s.customers} customers`, info));
    row.addEventListener("pointerleave", hideTip);
    row.addEventListener("focus", () => { const r = row.getBoundingClientRect(); showTip(r.left + 60, r.bottom - 4, `${s.customers} customers`, info); });
    row.addEventListener("blur", hideTip);
    return row;
  }));
  const customers = block("customers", "Customers", "Groups worked out from each customer's orders, timing and discount habits, and what the engine does for each.",
    panel("", "", bars, tableView(["Group", "Customers", "Avg spend", "Days since order"], d.segments.map(s => [s.name, s.customers, inr(s.avg_spend), s.avg_days_since_order ?? "—"]))));

  // products
  const ct = el("table");
  ct.append(el("thead", {}, el("tr", {}, ...["Category", "Revenue, 30 days", "Stock cover", "Avg margin", "Max discount"].map((h, i) => el("th", i ? { class: "num" } : {}, h)))));
  ct.append(el("tbody", {}, ...d.categories.map(c => {
    const flag = c.weeks_of_stock != null && c.weeks_of_stock < 4 ? el("span", { class: "flag low" }, " ⚠ low")
               : c.weeks_of_stock != null && c.weeks_of_stock > 12 ? el("span", { class: "flag slow" }, " ◷ slow") : "";
    return el("tr", {}, el("td", {}, c.category), el("td", { class: "num" }, inr(c.revenue_30)),
      el("td", { class: "num" }, c.weeks_of_stock == null ? "—" : `${c.weeks_of_stock} wk`, flag),
      el("td", { class: "num" }, `${c.avg_margin_pct}%`), el("td", { class: "num" }, `${c.discount_cap_pct}%`));
  })));
  const products = block("products", "Products", "⚠ low: under 4 weeks of stock, don't over-promote. ◷ slow: over 12 weeks, a candidate for a clearance offer. Max discount comes from rules.yaml.",
    panel("", "", el("div", { class: "scroll" }, ct)));

  // offers
  const ICON = { live: "✅ Live", pending: "⏳ Waiting", blocked: "🛡 Blocked", rejected: "✖ Rejected", ended: "⏹ Ended", expired: "⌛ Expired" };
  let offerBody;
  if (!d.offers.length) offerBody = el("p", { class: "empty" }, "No offers yet. Send /campaigns in the seller bot, or ask it for one.");
  else {
    const t = el("table");
    t.append(el("thead", {}, el("tr", {}, ...["Offer", "For", "Off", "Status", "Proposed by", "Ends"].map((h, i) => el("th", i === 2 ? { class: "num" } : {}, h)))));
    t.append(el("tbody", {}, ...d.offers.map(o => el("tr", {},
      el("td", {}, o.title, o.status === "blocked" && o.reason ? el("span", { class: "note" }, o.reason) : "", o.used ? el("span", { class: "note" }, "🛒 used by the customer") : ""),
      el("td", {}, o.audience), el("td", { class: "num" }, `${o.discount_pct}%`),
      el("td", {}, el("span", { class: `chip ${o.status}` }, ICON[o.status] || o.status)),
      el("td", {}, o.source), el("td", {}, fmtDate(o.valid_to))))));
    offerBody = el("div", { class: "scroll" }, t);
  }
  const offers = block("offers", "Offers", "Everything the rule engine, the AI agent and the seller proposed, newest first. Nothing goes live without the seller's Allow.", panel("", "", offerBody));

  // guardrails
  const guard = block("guardrails", "Guardrails", "Offers the rules lowered or stopped, and rule changes made from the seller bot.",
    panel("", "", d.audit.length ? el("ul", { class: "timeline" }, ...d.audit.map(e => el("li", { class: e.kind },
      e.kind === "rule_change" ? `📝 ${e.what}` : e.kind === "adjusted" ? `${e.what}: ${e.proposed}% lowered to ${e.final}%` : `${e.what}: blocked`,
      el("div", { class: "meta" }, [e.source, e.reason, e.at ? new Date(e.at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""].filter(Boolean).join(" · ")))))
      : el("p", { class: "empty" }, "Nothing yet: every offer so far was within the rules.")));

  // rules
  const r = d.rules;
  const rules = block("rules", "Rules in force", "From rules.yaml. To change one, tell the seller bot, e.g. “raise the Makhana limit to 18%”. It shows the change and waits for Confirm.",
    el("div", { class: "rules" }, ...[
      ["Highest discount on any offer", `${r.global.max_discount_pct}%`],
      ["Lowest margin after discount", `${r.global.min_margin_pct_after_discount}%`],
      ["Days between offers to one customer", r.global.cooldown_days_per_customer],
      ["Offers per customer per month", r.global.max_offers_per_customer_per_month],
      ["Minimum stock to promote", `${r.global.min_stock_for_offer} units`],
      ["Respect marketing opt-out", r.global.respect_marketing_opt_in ? "Yes" : "No"],
      ...Object.entries(r.category_caps_pct || {}).map(([c, v]) => [`${c}: max discount`, `${v}%`]),
      ...(r.first_order ? [["Welcome offer, first order", `${r.first_order.welcome_discount_pct}%`], ["Welcome offer minimum basket", inr(r.first_order.min_order_value)]] : []),
    ].map(([a, b]) => el("div", {}, el("span", {}, a), el("b", {}, b)))));

  $("#app").replaceChildren(head, brief, strip, sales, customers, products, offers, guard, rules);
}

// highlight the section in view
const links = [...document.querySelectorAll("aside nav a")];
function trackSections() {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll("#app [id]").forEach(s => io.observe(s));
  addEventListener("scroll", () => { if (scrollY < 120) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#overview")); }, { passive: true });
}

async function load(first) {
  try {
    const res = await fetch("dashboard.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const y = scrollY;
    render(await res.json());
    if (first) trackSections(); else scrollTo(0, y);
  } catch {
    if (!first) return; // keep the last good view
    $("#app").replaceChildren(el("div", { class: "state" }, el("h1", {}, "No dashboard data yet"),
      el("p", {}, "Start the bot (it builds the data), or run python -m src.dashboard. Open this page through python -m http.server -d web 8000.")));
  }
}
load(true);
setInterval(() => load(false), 60000);
</script>
</body>
</html>
