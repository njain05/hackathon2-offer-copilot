<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offer Copilot · Dashboard</title>
<meta name="description" content="Offer Copilot: customer analytics and offer decisions for Nishtha's Pantry.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #F1F4F1; --card: #FFFFFF; --ink: #14201C; --muted: #58685F; --hair: #DFE6E1; --band: rgba(20, 32, 28, .06);
    --side: #12302A; --side-ink: #D7E9E0; --side-muted: #8FB3A4; --accent: #E39B12;
    --series: #0A8A6F;
    --live: #1B6E3A; --pending: #9A5800; --blocked: #B42318;
    --head: "Bricolage Grotesque", system-ui, sans-serif; --body: "Hind", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #0F1513; --card: #18211E; --ink: #E4EDE8; --muted: #9AACA3; --hair: #27332F; --band: rgba(228, 237, 232, .06);
      --side: #0A0F0D; --side-ink: #D7E9E0; --side-muted: #7E9C90; --series: #2E9E83;
      --live: #6CC08A; --pending: #E9B04F; --blocked: #F2877D;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #0F1513; --card: #18211E; --ink: #E4EDE8; --muted: #9AACA3; --hair: #27332F; --band: rgba(228, 237, 232, .06);
    --side: #0A0F0D; --side-ink: #D7E9E0; --side-muted: #7E9C90; --series: #2E9E83;
    --live: #6CC08A; --pending: #E9B04F; --blocked: #F2877D;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 16px/1.5 var(--body); }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  aside { background: var(--side); color: var(--side-ink); padding: 26px 18px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; }
  .brand { font: 700 23px/1.05 var(--head); margin: 0; letter-spacing: -.01em; }
  .client { margin: 4px 0 0; color: var(--side-muted); font-size: 14.5px; }
  aside nav { display: flex; flex-direction: column; gap: 2px; }
  aside nav a { text-decoration: none; padding: 7px 10px; border-radius: 8px; font-weight: 500; color: var(--side-ink); border-left: 3px solid transparent; }
  aside nav a:hover { background: rgba(255,255,255,.06); }
  aside nav a.on { border-left-color: var(--accent); background: rgba(255,255,255,.08); }
  .side-foot { margin-top: auto; font-size: 13.5px; color: var(--side-muted); }
  .side-foot a { color: var(--side-ink); }

  main { padding: 30px 32px 60px; max-width: 1200px; width: 100%; }
  .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 20px; margin-bottom: 18px; }
  h1 { font: 700 clamp(28px, 4vw, 38px)/1.05 var(--head); margin: 0; letter-spacing: -.015em; }
  .asof { margin: 0; color: var(--muted); font-size: 14px; }

  /* today's brief: the one loud thing */
  .brief { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 18px; }
  .brief-title { margin: 0; padding: 14px 22px; font: 700 15px/1 var(--head); color: var(--muted); border-bottom: 1px solid var(--hair); }
  .insight { display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); gap: 4px 22px; padding: 18px 22px; border-bottom: 1px solid var(--hair); }
  .insight:last-child { border-bottom: 0; }
  .insight .fig { font: 700 clamp(30px, 4vw, 40px)/1 var(--head); letter-spacing: -.02em; }
  .insight:first-of-type .fig { font-size: clamp(44px, 6vw, 58px); color: var(--accent); }
  .insight p { margin: 0; }
  .insight .act { margin-top: 6px; color: var(--muted); font-size: 14.5px; }
  .insight .act q { color: var(--ink); font-weight: 600; quotes: "“" "”"; }

  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--card); border-radius: 16px; margin-bottom: 30px; }
  .strip div { padding: 14px 18px; border-right: 1px solid var(--hair); }
  .strip div:last-child { border-right: 0; }
  .strip .l { margin: 0; font-size: 13.5px; color: var(--muted); }
  .strip .v { margin: 2px 0 0; font: 700 24px/1.15 var(--head); }
  .strip .n { margin: 0; font-size: 13px; color: var(--muted); }
  .strip .down { color: var(--blocked); } .strip .up { color: var(--live); }

  section.block { margin-bottom: 34px; }
  .block > h2 { font: 700 22px/1.1 var(--head); margin: 0 0 4px; letter-spacing: -.01em; }
  .block > .sub { margin: 0 0 14px; color: var(--muted); font-size: 14.5px; max-width: 70ch; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
  .panel { background: var(--card); border-radius: 16px; padding: 18px 18px 12px; min-width: 0; }
  .panel h3 { margin: 0 0 2px; font: 700 16px/1.2 var(--head); }
  .panel .sub { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  details.table-view { margin-top: 6px; font-size: 14px; color: var(--muted); }
  details.table-view summary { cursor: pointer; }

  svg text { font: 12px var(--body); fill: var(--muted); }
  svg .band { fill: var(--band); } svg .gridline { stroke: var(--hair); stroke-width: 1; }
  svg .area { fill: var(--series); opacity: .1; } svg .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg .dot { fill: var(--series); stroke: var(--card); stroke-width: 2; } svg .cross { stroke: var(--muted); stroke-width: 1; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--card); border-radius: 8px; padding: 7px 10px;
         font-size: 13px; line-height: 1.35; z-index: 10; opacity: 0; transition: opacity .1s; max-width: 260px; }
  .tip strong { font-size: 15px; }

  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(120px, 210px) 1fr; gap: 12px; align-items: center; border-radius: 8px; }
  .bar-name { font-size: 15px; line-height: 1.2; font-weight: 500; }
  .bar-name small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  .bar-track { display: flex; align-items: center; gap: 8px; }
  .bar { height: 14px; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-row:hover .bar, .bar-row:focus .bar { filter: brightness(1.15); }
  .bar-val { font-size: 14px; font-weight: 600; white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 8px; border-bottom: 1px solid var(--hair); }
  td { padding: 9px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .note { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chip { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip.live { color: var(--live); } .chip.pending { color: var(--pending); } .chip.blocked { color: var(--blocked); }
  .chip.rejected, .chip.ended, .chip.expired { color: var(--muted); }
  .flag { font-size: 13px; font-weight: 600; white-space: nowrap; } .flag.low { color: var(--blocked); } .flag.slow { color: var(--pending); }

  .timeline { list-style: none; margin: 0; padding: 0 0 0 4px; }
  .timeline li { position: relative; padding: 0 0 14px 20px; font-size: 14.5px; }
  .timeline li::before { content: ""; position: absolute; left: 0; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .timeline li::after { content: ""; position: absolute; left: 4px; top: 18px; bottom: 0; width: 1px; background: var(--hair); }
  .timeline li:last-child::after { display: none; }
  .timeline li.blocked::before { background: var(--blocked); } .timeline li.adjusted::before { background: var(--pending); }
  .timeline .meta { color: var(--muted); font-size: 13px; }

  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 22px; background: var(--card); border-radius: 16px; padding: 8px 18px; }
  .rules div { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 14.5px; }
  .rules b { font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 14.5px; margin: 4px 0 10px; }
  .state { background: var(--card); border-radius: 16px; padding: 28px; }

  /* workspace: forms and actions */
  .mode-note { background: var(--card); border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; font-size: 14.5px; color: var(--muted); }
  .work-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .field { margin: 0 0 14px; }
  .field > label, .field > .lab { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; }
  input[type=text], input[type=number], input[type=password], textarea, input[type=search] {
    font: inherit; color: var(--ink); background: var(--canvas); border: 1px solid var(--hair); border-radius: 10px; padding: 9px 11px; width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--series); outline-offset: 0; border-color: transparent; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button, .seg button { font: inherit; font-size: 14px; border: 1px solid var(--hair); background: var(--canvas); color: var(--ink);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .chips button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--series); border-color: var(--series); color: #fff; }
  .seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14.5px; margin-top: 8px; }
  .checks input { accent-color: var(--series); }
  .prod-group { margin-bottom: 8px; } .prod-group .hint { display: block; margin-bottom: 4px; }
  .btn { font: 600 15px/1 var(--body); border-radius: 10px; padding: 11px 16px; cursor: pointer; border: 1px solid var(--hair); background: var(--card); color: var(--ink); }
  .btn.primary { background: var(--series); border-color: var(--series); color: #fff; }
  .btn.small { font-size: 13.5px; padding: 7px 11px; }
  .btn.danger { color: var(--blocked); }
  .btn:disabled { opacity: .55; cursor: progress; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .count { font-size: 14.5px; padding: 10px 12px; border-radius: 10px; background: var(--canvas); }
  .count b { font-size: 17px; }
  .result { border-radius: 12px; padding: 12px 14px; background: var(--canvas); font-size: 14.5px; margin-top: 12px; }
  .result.ok { border-left: 4px solid var(--live); } .result.warn { border-left: 4px solid var(--pending); } .result.bad { border-left: 4px solid var(--blocked); }
  .result ul { margin: 6px 0 0; padding-left: 18px; }
  .preview { white-space: pre-wrap; background: var(--card); border: 1px dashed var(--hair); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: 14px; }
  .matches { list-style: none; padding: 0; margin: 8px 0 0; } .matches li { padding: 6px 0; border-bottom: 1px solid var(--hair); }
  .matches button { font: inherit; background: none; border: 0; color: var(--series); cursor: pointer; padding: 0; text-decoration: underline; }
  .profile { font-size: 14.5px; } .profile dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0; }
  .profile dt { color: var(--muted); } .profile dd { margin: 0; }
  .toast { position: fixed; left: 16px; bottom: 16px; background: var(--ink); color: var(--card); padding: 12px 16px; border-radius: 12px;
           font-size: 14.5px; max-width: 360px; z-index: 20; opacity: 0; transform: translateY(8px); transition: opacity .15s, transform .15s; }
  .toast.on { opacity: 1; transform: none; }
  .rules div.r { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 10px; }
  .rules .edit { display: flex; align-items: center; gap: 6px; } .rules .edit input { width: 72px; padding: 5px 8px; text-align: right; }
  .rules .edit .hint { width: 34px; }
  .rules .pending { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; justify-content: flex-end; font-size: 13.5px; }
  .gate { max-width: 420px; }

  /* chat with Copilot */
  .chat-fab { position: fixed; right: 18px; bottom: 18px; z-index: 30; font: 600 15px/1 var(--body); border: 0; border-radius: 999px;
              padding: 14px 18px; background: var(--side); color: var(--side-ink); cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .chat-fab[aria-expanded="true"] { display: none; }
  .chat { position: fixed; right: 18px; bottom: 18px; z-index: 30; width: min(420px, calc(100vw - 32px)); height: min(640px, calc(100vh - 36px));
          background: var(--card); color: var(--ink); border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.25); display: none; flex-direction: column; overflow: hidden; }
  .chat.open { display: flex; }
  .chat header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--side); color: var(--side-ink); }
  .chat header b { font: 700 16px/1 var(--head); } .chat header small { display: block; color: var(--side-muted); font-size: 12.5px; margin-top: 3px; }
  .chat header button { background: none; border: 0; color: var(--side-ink); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  .chat-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 14px; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: var(--series); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--canvas); border-bottom-left-radius: 4px; }
  .msg.wait { color: var(--muted); }
  .chat-card { align-self: stretch; border: 1px solid var(--hair); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .chat-card b { display: block; } .chat-card .note { margin: 2px 0 6px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; }
  .suggest button { font: inherit; font-size: 13px; border: 1px solid var(--hair); background: var(--canvas); color: var(--ink); border-radius: 999px; padding: 6px 10px; cursor: pointer; text-align: left; }
  .people { align-self: stretch; border: 1px solid var(--hair); border-radius: 12px; overflow: auto; max-height: 300px; font-size: 13.5px; }
  .people table { font-size: 13.5px; } .people th, .people td { padding: 6px 8px; } .people th { position: sticky; top: 0; background: var(--card); }
  .chat form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--hair); }
  .chat form textarea { min-height: 42px; max-height: 120px; resize: none; }

  @media (max-width: 960px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: sticky; height: auto; padding: 12px 16px; gap: 8px; z-index: 5; flex-direction: column; }
    aside .side-foot, aside .client { display: none; }
    aside nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
    aside nav a { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; padding: 6px 10px; }
    aside nav a.on { border-bottom-color: var(--accent); }
    main { padding: 20px 16px 48px; }
    .cols, .work-grid, .row2 { grid-template-columns: 1fr; }
    .insight { grid-template-columns: 1fr; }
    .strip div { border-right: 0; border-bottom: 1px solid var(--hair); }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .tip, .toast { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div><p class="brand">Offer Copilot</p><p class="client">for Nishtha's Pantry</p></div>
    <nav aria-label="Sections">
      <a href="#overview" class="on">Overview</a><a href="#create">Create offer</a><a href="#find">Find a customer</a><a href="#sales">Sales</a><a href="#customers">Customers</a>
      <a href="#products">Products</a><a href="#offers">Offers</a><a href="#guardrails">Guardrails</a><a href="#rules">Rules</a>
    </nav>
    <div class="side-foot"><p>Store data: synthetic export.</p><p><a href="offers.html">Open the store's offers page</a></p></div>
  </aside>
  <main id="app"><div id="top"></div><div id="work"></div><div id="report"></div></main>
</div>
<div class="tip" id="tip" role="status"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="chat-fab" id="chat-fab" type="button" aria-expanded="false" aria-controls="chat" hidden>💬 Ask Copilot</button>
<section class="chat" id="chat" aria-label="Chat with Offer Copilot">
  <header><div><b>Ask Copilot</b><small>Offers, customers, results and rules, in plain words</small></div>
    <button type="button" id="chat-close" aria-label="Close chat">×</button></header>
  <div class="chat-log" id="chat-log" aria-live="polite"></div>
  <form id="chat-form"><textarea id="chat-input" placeholder="e.g. What should I offer Harpreet?" aria-label="Message"></textarea>
    <button class="btn primary" type="submit">Send</button></form>
</section>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const compactInr = n => n >= 1e5 ? "₹" + (n / 1e5).toFixed(1).replace(/\.0$/, "") + "L" : n >= 1e3 ? "₹" + Math.round(n / 1e3) + "K" : inr(n);
const fmtDate = s => new Date(s + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (e.className = v) : e.setAttribute(k, v);
  for (const k of kids) if (k !== "" && k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; }

const tip = $("#tip");
function showTip(x, y, value, label) {
  tip.replaceChildren(el("strong", {}, value), el("br"), el("span", {}, label));
  const w = tip.offsetWidth || 180;
  tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
  tip.style.top = (y + 14) + "px";
  tip.style.opacity = 1;
}
const hideTip = () => (tip.style.opacity = 0);
function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw || 1)); return [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= raw); }

// one series, festival bands as annotation, crosshair + keyboard readout
function lineChart(host, points, { festivals = [], fmt = inr, tick = compactInr, label = "", height = 220 }) {
  const W = 720, H = height, m = { l: 50, r: 14, t: 16, b: 26 };
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": label });
  const xs = i => m.l + (i / (points.length - 1)) * (W - m.l - m.r);
  const step = niceStep((Math.max(...points.map(p => p.y)) * 1.1 || 1) / 4);
  const top = Math.ceil((Math.max(...points.map(p => p.y)) * 1.1) / step) * step || step;
  const ys = v => H - m.b - (v / top) * (H - m.t - m.b);
  for (const f of festivals) {
    const idx = points.map((p, i) => [p, i]).filter(([p]) => p.end >= f.start && p.start <= f.end).map(([, i]) => i);
    if (!idx.length) continue;
    const x0 = xs(idx[0]) - 7, x1 = Math.min(xs(idx[idx.length - 1]) + 7, W - m.r);
    svg.append(svgEl("rect", { class: "band", x: x0, y: m.t, width: x1 - x0, height: H - m.t - m.b, rx: 4 }));
    const nearEnd = x1 > W - m.r - 34;
    const t = svgEl("text", { x: nearEnd ? x1 - 2 : (x0 + x1) / 2, y: m.t + 12, "text-anchor": nearEnd ? "end" : "middle" }); t.textContent = f.name; svg.append(t);
  }
  for (let v = 0; v <= top; v += step) {
    svg.append(svgEl("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: ys(v), y2: ys(v) }));
    const t = svgEl("text", { x: m.l - 8, y: ys(v) + 4, "text-anchor": "end" }); t.textContent = tick(v); svg.append(t);
  }
  let lastMonth = "", lastX = -1e9;
  points.forEach((p, i) => {
    const mo = new Date(p.start + "T00:00:00").toLocaleDateString("en-IN", { month: "short" });
    if (mo !== lastMonth && xs(i) - lastX >= 44) { const t = svgEl("text", { x: xs(i), y: H - 6, "text-anchor": "middle" }); t.textContent = mo; svg.append(t); lastX = xs(i); }
    lastMonth = mo;
  });
  const d = points.map((p, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(p.y).toFixed(1)}`).join("");
  svg.append(svgEl("path", { class: "area", d: `${d}L${xs(points.length - 1)},${ys(0)}L${xs(0)},${ys(0)}Z` }));
  svg.append(svgEl("path", { class: "line", d }));
  const li = points.length - 1;
  svg.append(svgEl("circle", { class: "dot", cx: xs(li), cy: ys(points[li].y), r: 4.5 }));
  const cross = svgEl("line", { class: "cross", y1: m.t, y2: H - m.b, opacity: 0 });
  const dot = svgEl("circle", { class: "dot", r: 4.5, opacity: 0 });
  svg.append(cross, dot);
  const hit = svgEl("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent", tabindex: 0, "aria-label": `${label}: use left and right arrows` });
  const pick = i => {
    i = Math.max(0, Math.min(li, i));
    for (const [a, b] of [["x1", "x2"]]) { cross.setAttribute(a, xs(i)); cross.setAttribute(b, xs(i)); }
    cross.setAttribute("opacity", 1); dot.setAttribute("cx", xs(i)); dot.setAttribute("cy", ys(points[i].y)); dot.setAttribute("opacity", 1);
    return i;
  };
  let cur = li;
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    cur = pick(Math.round((((e.clientX - r.left) * (W / r.width)) - m.l) / (W - m.l - m.r) * li));
    showTip(e.clientX, e.clientY, fmt(points[cur].y), points[cur].label);
  });
  hit.addEventListener("pointerleave", () => { hideTip(); cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); });
  hit.addEventListener("keydown", e => {
    if (!["ArrowLeft", "ArrowRight"].includes(e.key)) return;
    e.preventDefault();
    cur = pick(cur + (e.key === "ArrowRight" ? 1 : -1));
    const r = svg.getBoundingClientRect();
    showTip(r.left + xs(cur) * r.width / W, r.top + 8, fmt(points[cur].y), points[cur].label);
  });
  hit.addEventListener("blur", () => { hideTip(); cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); });
  svg.append(hit);
  host.append(svg);
}

function ruleRow(labelText, value, unit, key, category) {
  const shown = typeof value === "number" ? `${unit === "%" ? value + "%" : value + (unit ? " " + unit : "")}` : value;
  const row = el("div", { class: "r" }, el("span", {}, labelText));
  if (!LIVE || !key) { row.append(el("b", {}, shown)); return row; }
  const input = el("input", { type: "number", value, min: 0, "aria-label": labelText });
  const save = el("button", { class: "btn small", type: "button" }, "Save");
  row.append(el("span", { class: "edit" }, input, unit ? el("span", { class: "hint" }, unit) : "", save));
  save.addEventListener("click", async () => {
    if (Number(input.value) === Number(value)) return toast("No change.");
    row.querySelector(".pending")?.remove();
    try {
      const p = await post("/api/rules", { rule: key, category: category || "", value: Number(input.value) });
      const box = el("span", { class: "pending" }, p.preview);
      const ok = el("button", { class: "btn small primary", type: "button" }, "Confirm"), no = el("button", { class: "btn small", type: "button" }, "Cancel");
      box.append(ok, no); row.append(box); EDITING = true;
      no.addEventListener("click", () => { box.remove(); input.value = value; EDITING = false; });
      ok.addEventListener("click", async () => {
        try { const done = await post("/api/rules", { rule: key, category: category || "", value: Number(input.value), confirm: true });
              toast(`✅ Updated rules.yaml: ${done.preview}`); EDITING = false; refresh(); }
        catch (e) { toast(`🛡 ${e.message}`); }
      });
    } catch (e) { toast(`🛡 Can't change that: ${e.message}`); input.value = value; }
  });
  return row;
}

function offerActions(o) {

        const s = r.offer.status;
        toast(s === "approved" ? `✅ Live · sent to ${r.sent} customer chat${r.sent === 1 ? "" : "s"} on Telegram`

function trackSections() {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll("#app [id]").forEach(s => io.observe(s));

async function call(method, path, body) {

  catch { const e = new Error(`Can't reach the dashboard server at ${location.host}. Is "python -m src.api" still running? Restart it and reload this page.`); e.status = 0; throw e; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || `Error ${res.status}`); e.status = res.status; throw e; }
  return data;
}

async function load(first) {

    const y = scrollY; render(d); if (first) trackSections(); else scrollTo(0, y);

    if (e.status === 401) return showGate(getCode() ? "That code didn't work. Try again." : "Enter the seller code from .env to see and run the dashboard.");

  try { // no server: read-only from the exported file

  // ask in plain words
  const askBox = el("textarea", { placeholder: "e.g. 12% off nuts for lapsed customers in Ludhiana and Amritsar for a week", "aria-label": "Describe the offer" });
  const askBtn = el("button", { class: "btn", type: "button" }, "✨ Fill the form for me");
  askBtn.addEventListener("click", async () => {
    if (!askBox.value.trim()) return askBox.focus();

    try { const f = await post("/api/ask", { text: askBox.value }); Object.assign(draft, f, { filters: { ...draft.filters, ...f.filters } }); paint(); toast("Form filled in. Check it, then press Check against rules."); }
    catch (e) { toast(`⚠ ${e.message}`); }
    askBtn.disabled = false; askBtn.textContent = "✨ Fill the form for me";
  });

  const paint = () => {
    const f = draft.filters;

      b.addEventListener("click", () => { draft.audience_mode = v; paint(); }); return b; }));

      el("div", { class: "field" }, el("span", { class: "lab" }, "Customer group ", el("span", { class: "hint" }, "(none = any)")),
        chipGroup(o.segments.map(s => ({ value: s.key, label: s.label })), f.segments, updateCount)),
      el("div", { class: "field" }, el("span", { class: "lab" }, "City ", el("span", { class: "hint" }, "(none = all cities)")),
        chipGroup(o.cities.map(c => ({ value: c, label: c })), f.cities, updateCount)),
      el("div", { class: "field" }, el("span", { class: "lab" }, "Favourite category ", el("span", { class: "hint" }, "(none = any)")),
        chipGroup(o.categories.map(c => ({ value: c, label: c })), f.categories, updateCount)),
      (() => { const a = el("input", { type: "checkbox", id: "ft" }), b = el("input", { type: "checkbox", id: "wc" });
        a.checked = f.first_time_only; b.checked = f.with_cart;
        a.addEventListener("change", () => { f.first_time_only = a.checked; updateCount(); }); b.addEventListener("change", () => { f.with_cart = b.checked; updateCount(); });
        return el("div", { class: "checks" }, el("label", {}, a, " First-time customers only"), el("label", {}, b, " Has items in cart")); })(),
      (() => { // optional: only the top N
        const n = el("input", { type: "number", id: "f-limit", min: 0, value: f.limit || "", placeholder: "all", style: "width:84px" });
        const by = el("select", { id: "f-rank", "aria-label": "Rank customers by", style: "font:inherit;padding:8px;border-radius:10px;border:1px solid var(--hair);background:var(--canvas);color:var(--ink)" },
          ...[["spend", "highest spend"], ["orders", "most orders"], ["recent", "most recent order"], ["cart", "most items in cart"]].map(([v, l]) => {
            const o2 = el("option", { value: v }, l); if ((f.rank_by === "none" ? "spend" : f.rank_by) === v) o2.selected = true; return o2; }));
        const upd = () => { f.limit = Number(n.value) || 0; f.rank_by = f.limit ? by.value : "none"; updateCount(); };
        n.addEventListener("input", upd); by.addEventListener("change", upd);
        return el("div", { class: "checks" }, el("label", { for: "f-limit" }, "Only the top "), n, el("span", {}, " customers by "), by);
      })(),
    ] : [];
    const byCat = {}; o.products.forEach(p => (byCat[p.category] ||= []).push(p));
    const prodBox = el("div", {}, ...Object.entries(byCat).map(([cat, ps]) => el("div", { class: "prod-group" }, el("span", { class: "hint" }, cat),
      chipGroup(ps.map(p => ({ value: p.product_id, label: `${p.product_name} · ₹${p.price}` })), draft.product_ids, () => {}))));
    const num = (k, attrs) => { const i = el("input", { type: "number", value: draft[k], ...attrs }); i.addEventListener("input", () => (draft[k] = Number(i.value))); return i; };
    const txt = (k, tag, attrs) => { const i = el(tag, { ...attrs }); i.value = draft[k] || ""; i.addEventListener("input", () => (draft[k] = i.value)); return i; };
    const title = txt("title", "input", { type: "text", id: "f-title", placeholder: "e.g. Diwali nuts for you", maxlength: 60 });
    const message = txt("message", "textarea", { id: "f-msg", placeholder: "What the customer reads (max ~35 words)" });
    const writeBtn = el("button", { class: "btn small", type: "button" }, "✍️ Write it with AI");
    writeBtn.addEventListener("click", async () => {
      writeBtn.disabled = true;
      try { const w = await post("/api/write", draft); draft.title = w.title; draft.message = w.message; title.value = w.title; message.value = w.message; }
      catch (e) { toast(`⚠ ${e.message}`); }
      writeBtn.disabled = false;
    });
    const checkBtn = el("button", { class: "btn", type: "button" }, "Check against rules");
    const createBtn = el("button", { class: "btn primary", type: "button" }, "Create offer");
    checkBtn.addEventListener("click", async () => {
      try { const c = await post("/api/check", draft); showResult(c); } catch (e) { toast(`⚠ ${e.message}`); }
    });
    createBtn.addEventListener("click", async () => {
      if (!draft.product_ids.length) return toast("Pick at least one product.");
      createBtn.disabled = true;
      try {
        const r = await post("/api/offers", draft);
        const s = r.offer.status;
        toast(s === "blocked" ? `🛡 Blocked by the rules: ${r.offer.blocked_reasons[0]}` :
              r.adjusted ? `⚖️ Created at ${r.offer.discount_pct}% (the rules lowered it). Approve it in Offers below.` : "Created. Approve it in Offers below.");
        result.replaceChildren(); refresh();
      } catch (e) { toast(`⚠ ${e.message}`); }
      createBtn.disabled = false;
    });
    form.replaceChildren(
      el("h3", {}, "New offer"), el("p", { class: "sub" }, "Nothing reaches customers until you approve it in Offers. The rules check it twice: now and on approve."),
      el("div", { class: "field" }, el("span", { class: "lab" }, "Who gets it"), modeSeg), ...groupBits, count,
      el("div", { class: "field", style: "margin-top:14px" }, el("span", { class: "lab" }, "Products"), prodBox),
      el("div", { class: "row2" }, el("div", { class: "field" }, el("label", { for: "f-disc" }, "Discount %"), num("discount_pct", { id: "f-disc", min: 1, max: 90 })),
                                   el("div", { class: "field" }, el("label", { for: "f-days" }, "Runs for (days)"), num("valid_days", { id: "f-days", min: 1, max: 60 }))),
      el("div", { class: "field" }, el("label", { for: "f-title" }, "Title"), title), el("div", { class: "field" }, el("label", { for: "f-msg" }, "Message"), message, el("div", { class: "actions", style: "margin-top:6px" }, writeBtn)),
      el("div", { class: "actions" }, checkBtn, createBtn), result);
    updateCount();
  };
  const showResult = c => {
    const cls = c.ok ? "ok" : c.adjusted_discount ? "warn" : "bad";
    const head = c.ok ? "✅ Within the rules." : c.adjusted_discount ? `⚖️ Allowed at ${c.adjusted_discount}%: it will be lowered to that.` : "🛡 The rules would block this:";
    result.replaceChildren(el("div", { class: `result ${cls}` }, el("b", {}, head),
      c.reasons.length ? el("ul", {}, ...c.reasons.map(r => el("li", {}, r))) : "",
      el("div", { class: "hint", style: "margin-top:8px" }, "What the customer will see:"), el("div", { class: "preview" }, c.preview)));
  };

  const ai = o.ai ? "" : el("p", { class: "hint" }, "AI is off (no ANTHROPIC_API_KEY): fill the form by hand.");
  const create = el("section", { class: "block", id: "create" }, el("h2", {}, "Create an offer"),
    el("p", { class: "sub" }, "Describe it in plain words, or build it yourself: pick who, what and how much."),
    el("div", { class: "work-grid" }, form,
      el("div", { class: "panel" }, el("h3", {}, "Describe it"), el("p", { class: "sub" }, "Claude fills in the form; you check it before anything is created."),
        askBox, el("div", { class: "actions", style: "margin-top:8px" }, askBtn), ai)));

  // find a customer
  const q = el("input", { type: "search", placeholder: "Name or id, e.g. Harpreet or C0042", "aria-label": "Find a customer" });
  const out = el("div");
  const findForm = el("form", { class: "actions" }, q, el("button", { class: "btn", type: "submit" }, "Find"));
  const showCustomer = async query => {
    try {
      const r = await call("GET", `/api/customer?q=${encodeURIComponent(query)}`);
      if (r.matches.length) {
        out.replaceChildren(el("p", { class: "hint" }, "Several customers match:"), el("ul", { class: "matches" }, ...r.matches.map(m => {
          const b = el("button", { type: "button" }, `${m.name} · ${m.city} · ${m.customer_id}`); b.addEventListener("click", () => showCustomer(m.customer_id));
          return el("li", {}, b); })));
        return;
      }
      if (!r.customer) { out.replaceChildren(el("p", { class: "empty" }, "No customer found.")); return; }
      const c = r.customer;
      const suggest = el("button", { class: "btn primary", type: "button" }, "Suggest an offer for them");
      const slot = el("div");
      suggest.addEventListener("click", async () => {
        suggest.disabled = true; suggest.textContent = "Deciding…";
        try {
          const s = await post(`/api/customers/${c.customer_id}/suggest`, {});
          if (!s.offer) { slot.replaceChildren(el("div", { class: "result ok" }, el("b", {}, "No discount for this customer."), el("div", {}, s.explanation))); }
          else {
            const o2 = s.offer;
            slot.replaceChildren(el("div", { class: "result ok" }, el("b", {}, `${o2.discount_pct}% off: ${o2.title}`), el("div", {}, s.explanation),
              ...(s.notes || []).map(n => el("div", { class: "hint" }, "⚖️ " + n)),
              el("div", { class: "preview" }, o2.message), el("div", { class: "actions", style: "margin-top:8px" }, offerActions({ ...o2, status: "pending" }))));
          }
          refresh();
        } catch (e) { toast(`⚠ ${e.message}`); }
        suggest.disabled = false; suggest.textContent = "Suggest an offer for them";
      });
      const days = c.days_since_last_order == null ? "never ordered" : `${c.days_since_last_order} days ago`;
      out.replaceChildren(el("div", { class: "profile" }, el("h3", {}, `${c.name} · ${c.city}`),
        el("dl", {}, el("dt", {}, "Group"), el("dd", {}, c.segment_label), el("dt", {}, "Orders"), el("dd", {}, `${c.orders_total} · ${inr(c.lifetime_value)} spent`),
          el("dt", {}, "Last order"), el("dd", {}, days), el("dt", {}, "Uses discounts"), el("dd", {}, `${Math.round(c.discount_order_share * 100)}% of orders`),
          el("dt", {}, "Cart"), el("dd", {}, c.cart_items ? `${c.cart_items} item(s)` : "empty"), el("dt", {}, "Points"), el("dd", {}, `${c.reward_points}${c.points_expiring ? ` · ${c.points_expiring} expiring` : ""}`),
          el("dt", {}, "Marketing"), el("dd", {}, c.marketing_opt_in ? "opted in" : "opted out: no offers"),
          el("dt", {}, "On the bot"), el("dd", {}, c.on_bot ? "yes, a classmate is playing them" : "not yet: approved offers are saved, not sent")),
        c.marketing_opt_in ? suggest : "", slot));
    } catch (e) { toast(`⚠ ${e.message}`); }
  };
  findForm.addEventListener("submit", e => { e.preventDefault(); if (q.value.trim()) showCustomer(q.value.trim()); });
  const find = el("section", { class: "block", id: "find" }, el("h2", {}, "Find a customer"),
    el("p", { class: "sub" }, "See one customer's profile and give them a personal offer. The engine decides how much (or no discount at all)."),
    el("div", { class: "panel" }, findForm, out));

  $("#work").replaceChildren(create, find);
  paint();
}

// ---------- chat with Copilot ----------
const chatLog = $("#chat-log"), chatInput = $("#chat-input"), chatHistory = [];
function mdNodes(text) { // **bold** -> <b>, everything else as plain text (never innerHTML)
  return String(text).split(/(\*\*[^*]+\*\*)/g).filter(Boolean).map(part => part.startsWith("**") ? el("b", {}, part.slice(2, -2)) : document.createTextNode(part));
}
function say(who, text) { const m = el("div", { class: `msg ${who}` }, ...mdNodes(text)); chatLog.append(m); chatLog.scrollTop = chatLog.scrollHeight; return m; }
function peopleTable(rows) {
  const t = el("table");
  t.append(el("thead", {}, el("tr", {}, ...["#", "Customer", "Group", "Orders", "Spend", "Last order"].map((h, i) => el("th", i >= 3 ? { class: "num" } : {}, h)))));
  t.append(el("tbody", {}, ...rows.map((r, i) => el("tr", {}, el("td", {}, i + 1),
    el("td", {}, r.name, el("span", { class: "note" }, `${r.city} · ${r.customer_id}${r.opted_in ? "" : " · opted out"}`)),
    el("td", {}, r.group), el("td", { class: "num" }, r.orders), el("td", { class: "num" }, inr(r.spend)),
    el("td", { class: "num" }, r.last_order_days == null ? "never" : `${r.last_order_days}d ago`)))));
  return el("div", { class: "people" }, t);
}
function offerCard(o) {
  const status = o.status === "approved" ? "live" : o.status;
  const who = o.audience_label ? `${o.audience_label} · ${o.customer_ids.length} customers` : o.target === "ALL" ? "Everyone" : o.target;
  return el("div", { class: "chat-card" }, el("b", {}, `${o.title} · ${o.discount_pct}% off`), el("span", { class: "note" }, `${who} · code ${o.code} · until ${fmtDate(o.valid_to)}`),
    el("div", {}, o.message), status === "blocked" ? el("span", { class: "note" }, `🛡 ${o.blocked_reasons[0] || "Blocked"}`) : offerActions({ ...o, status }),
    o.customer_ids && o.customer_ids.length ? seeCustomers(o) : "");
}
function seeCustomers(o) {
  const b = el("button", { class: "btn small", type: "button", style: "margin-top:6px" }, `👥 See the ${o.customer_ids.length} customers`);
  b.addEventListener("click", async () => {
    b.disabled = true;
    try { const r = await call("GET", `/api/offers/${o.offer_id}/customers`); b.replaceWith(peopleTable(r.customers)); }
    catch (e) { toast(`⚠ ${e.message}`); b.disabled = false; }
  });
  return b;
}
function confirmCard(c) {
  const ok = el("button", { class: "btn small primary", type: "button" }, "Confirm"), no = el("button", { class: "btn small", type: "button" }, "Cancel");
  const box = el("div", { class: "actions" }, ok, no);
  no.addEventListener("click", () => { box.replaceChildren(el("span", { class: "hint" }, "Cancelled.")); });
  ok.addEventListener("click", async () => {
    ok.disabled = true;
    try {
      if (c.kind === "rule") { const r = await post("/api/rules", { rule: c.rule, category: c.category, value: c.value, confirm: true }); box.replaceChildren(el("span", {}, `✅ Updated rules.yaml: ${r.preview}`)); }
      else { await post(`/api/offers/${c.offer_id}/end`, {}); box.replaceChildren(el("span", {}, "⏹ Ended: removed from the offers page.")); }
      refresh();
    } catch (e) { box.replaceChildren(el("span", {}, `🛡 ${e.message}`)); }
  });
  return box;
}
async function sendChat(text) {
  text = text.trim(); if (!text) return;
  say("me", text); chatInput.value = "";
  const wait = say("bot wait", "Thinking…");
  try {
    const r = await post("/api/chat", { text, history: chatHistory.slice(-6) });
    wait.remove(); say("bot", r.text || "Done.");
    if ((r.customers || []).length) chatLog.append(peopleTable(r.customers));
    (r.offers || []).forEach(o => chatLog.append(offerCard(o)));
    if (r.confirm) chatLog.append(confirmCard(r.confirm));
    chatHistory.push({ role: "seller", text }, { role: "assistant", text: r.text || "" });
    if ((r.offers || []).length) refresh();
  } catch (e) { wait.remove(); say("bot", `⚠ ${e.message}`); }
  chatLog.scrollTop = chatLog.scrollHeight;
}
function openChat(open) {
  $("#chat").classList.toggle("open", open); $("#chat-fab").setAttribute("aria-expanded", String(open));
  if (open) {
    if (!chatLog.children.length) {
      say("bot", "Hi! Ask me anything about your customers and offers, or tell me what to do. I check everything against your rules, and nothing goes out until you approve it.");
      const ideas = ["What should I offer Harpreet?", "15% off almonds for lapsed customers in Ludhiana", "Can I give 25% on gift boxes?",
                     "How are my offers doing?", "Propose Diwali campaigns", "Raise the Makhana limit to 18%"];
      const box = el("div", { class: "suggest" }, ...ideas.map(t => { const b = el("button", { type: "button" }, t); b.addEventListener("click", () => sendChat(t)); return b; }));
      chatLog.append(box);
    }
    chatInput.focus();
  } else $("#chat-fab").focus();
}
$("#chat-fab").addEventListener("click", () => openChat(true));
$("#chat-close").addEventListener("click", () => openChat(false));
$("#chat").addEventListener("keydown", e => { if (e.key === "Escape") openChat(false); });
$("#chat-form").addEventListener("submit", e => { e.preventDefault(); sendChat(chatInput.value); });
chatInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(chatInput.value); } });

load(true);
setInterval(() => { if (!EDITING) refresh(); }, 60000);
</script>
